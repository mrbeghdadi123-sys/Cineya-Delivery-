name: Build CINEYA APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Found: $ZIP"
          unzip "$ZIP" -d extracted
          APPDIR=$(find extracted -maxdepth 3 -type d -name app | head -n 1)
          echo "App dir: $APPDIR"
          cp -r "$APPDIR"/* .
          ls -la

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cineya-delivery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
